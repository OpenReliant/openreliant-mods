<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240">
<defs>
<radialGradient id="sky" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#12233f"/><stop offset="1" stop-color="#03060d"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>
<rect width="320" height="240" fill="url(#sky)"/>
<g fill="#ffffff">
<circle cx="22" cy="26" r="0.9" opacity="0.7"/><circle cx="61" cy="70" r="0.6" opacity="0.5"/>
<circle cx="104" cy="16" r="1.1" opacity="0.8"/><circle cx="292" cy="30" r="0.9" opacity="0.7"/>
<circle cx="301" cy="92" r="0.6" opacity="0.5"/><circle cx="274" cy="178" r="1.0" opacity="0.7"/>
<circle cx="236" cy="222" r="0.6" opacity="0.5"/><circle cx="38" cy="196" r="1.0" opacity="0.6"/>
<circle cx="84" cy="150" r="0.7" opacity="0.5"/><circle cx="214" cy="40" r="0.8" opacity="0.6"/>
<circle cx="18" cy="122" r="0.7" opacity="0.5"/><circle cx="150" cy="226" r="0.8" opacity="0.6"/>
</g>
<!-- The guns' tracers, turned from straight ahead onto the target. -->
<g stroke-linecap="round" fill="none">
<path d="M70,236 L188,104" stroke="#5ee0ff" stroke-width="7" stroke-opacity="0.3" filter="url(#glow)"/>
<path d="M250,236 L196,108" stroke="#5ee0ff" stroke-width="7" stroke-opacity="0.3" filter="url(#glow)"/>
<path d="M70,236 L188,104" stroke="#b8f4ff" stroke-width="2" stroke-dasharray="14 10"/>
<path d="M250,236 L196,108" stroke="#b8f4ff" stroke-width="2" stroke-dasharray="14 10"/>
</g>
<!-- The reticle at the middle. -->
<g stroke="#7fd37f" stroke-width="2" fill="none" opacity="0.6">
<circle cx="160" cy="120" r="16"/>
<path d="M160,96 V108 M160,132 V144 M136,120 H148 M172,120 H184"/>
</g>
<!-- The target, off the middle, under blind fire's sight. -->
<polygon points="206,104 186,94 191,104 186,114" fill="#a9b4c6" stroke="#dfe6f1" stroke-width="0.8" stroke-linejoin="round"/>
<g stroke="#ffe066" stroke-width="2.5" fill="none" stroke-linecap="square">
<circle cx="194" cy="104" r="20" stroke-opacity="0.9"/>
<path d="M194,78 V90 M194,118 V130 M168,104 H180 M208,104 H220"/>
</g>
</svg>
