[Mod]
Name=Improved Landing Sequence
Version=1.0
Author=Zabk
Description=Landing on your carrier is no longer automatic. Once the carrier clears you after PERMISSION TO LAND, a red approach marker appears, with a new objective, and the landing starts only when you fly through it. On the Reliant, the marker stands above the stern, a little to the right of the hull. On the Yamato, it stands above the left side, three quarters of the way aft. Fly through it from behind, the way the carrier is heading.
OpenReliant=1.1.0-rc.4

