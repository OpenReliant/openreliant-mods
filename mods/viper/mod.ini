[Mod]
Name=Viper Mk II
Version=1.0
Author=LocoPixel (model), OpenReliant (conversion)
Url=https://github.com/OpenReliant/openreliant-mods
Description=The Viper Mk II, a new ship type for the player. A fast, agile gunfighter: no blind fire, light shields, a strong hull and two kinetic guns. Built from glTF with sltool shp from-gltf. This work is based on "Battlestar Galactica Viper Mark 2" (https://sketchfab.com/3d-models/battlestar-galactica-viper-mark-2-1bf9872a1e8d4b39a259e14a7015a0a2) by LocoPixel (https://sketchfab.com/locopixel), licensed under CC-BY-NC-4.0 (http://creativecommons.org/licenses/by-nc/4.0/).
OpenReliant=0.7

[Guns]
kew=

; Kinetic energy weapons: fast-firing slugs that hit the hull harder than the shields.
[Gun kew]
Base=proton_cannon
Name=Kinetic Guns

[ShipTypes]
viper=

; Based on the Mirage (5), which carries no blind fire, for the gunnery display's layout and the
; cockpit; its stats are its own (records.luau).
[ShipType viper]
Base=5
Model=viper.shp
Name=Viper Mk II
