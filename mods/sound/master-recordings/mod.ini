[Mod]
Name=Master Recordings
Version=1.0
Author=Ian Livingstone, OpenReliant
Url=https://github.com/OpenReliant/openreliant-mods
Description=The game's music from Ian Livingstone's original 44.1 kHz master recordings, in place of the 22 kHz copies the game shipped with: in the missions, the menus, the rooms and the CD player. Each piece is cut from its master to the game's own length, so it loops where the game's does. The CD player also gets 36 more tracks, the masters in full: the game's pieces it doesn't list, the movies' music and the characters' themes. The Jukebox mod turns to their pages.
OpenReliant=0.14

[Scripts]
; Adds the masters in full to the CD player, after its 24 tracks (records.cd_player).
