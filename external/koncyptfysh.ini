; KonCyptFysh's art packs, in the submodule beside this file. His catalog.json lists his packs and
; marks the ones that are out as available; those are the collection's. His packs' mod.ini files
; leave out their author and web page, so Name and Url stand in for them.
[Artist]
Name=KonCyptFysh
Url=https://koncyptfysh.github.io/OpenReliant-Art-Packs/
Catalog=catalog.json

; The collection's category for each of his top folders.
[Categories]
Alliance Fighters=ships/fighters/alliance
Coalition Fighters=ships/fighters/coalition
Torpedo Bombers=ships/fighters/torpedo-bombers
Alliance Capital Ships=ships/capital-ships/alliance
Coalition Capital Ships=ships/capital-ships/coalition
Uncategorised Ships=ships/other
Weapons=weapons
Environment and Planets=environment
HUD=interface
